version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sensor_postgres
    environment:
      POSTGRES_DB: sensor_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sensor_web
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: sensor_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      SERIAL_PORT: ${SERIAL_PORT:-COM0}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
    ports:
      - "8000:8000"
    devices:
      - ${SERIAL_PORT:-/dev/ttyUSB0}:${SERIAL_PORT:-/dev/ttyUSB0}
    volumes:
      - ./src:/app
    restart: unless-stopped

volumes:
  postgres_data:
