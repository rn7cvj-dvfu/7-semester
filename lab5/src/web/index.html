<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Monitoring System</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            padding: 40px 20px;
            color: #000000;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #000000;
            margin-bottom: 50px;
            font-size: 2em;
            font-weight: 300;
            letter-spacing: -0.5px;
        }
        
        .current-temp {
            border: 1px solid #000000;
            padding: 40px;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .temp-display {
            font-size: 5em;
            font-weight: 300;
            color: #000000;
            margin: 20px 0;
            letter-spacing: -2px;
        }
        
        .temp-label {
            font-size: 0.9em;
            color: #000000;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 400;
        }
        
        .timestamp {
            color: #666666;
            font-size: 0.85em;
            font-weight: 300;
        }
        
        .controls {
            border: 1px solid #000000;
            padding: 25px;
            margin-bottom: 40px;
        }
        
        .control-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .control-group label {
            font-weight: 400;
            color: #000000;
            font-size: 0.9em;
        }
        
        .control-group select,
        .control-group button {
            padding: 8px 16px;
            border: 1px solid #000000;
            font-size: 0.9em;
            cursor: pointer;
            background: #ffffff;
            color: #000000;
            font-family: inherit;
            transition: all 0.2s;
        }
        
        .control-group select:hover,
        .control-group button:hover {
            background: #000000;
            color: #ffffff;
        }
        
        .control-group select:focus,
        .control-group button:focus {
            outline: none;
            box-shadow: 0 0 0 2px #000000;
        }
        
        .chart-container {
            border: 1px solid #000000;
            padding: 40px;
            margin-bottom: 40px;
        }
        
        .chart-container h2 {
            color: #000000;
            margin-bottom: 30px;
            font-size: 1.2em;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .data-table {
            border: 1px solid #000000;
            padding: 40px;
            overflow-x: auto;
        }
        
        .data-table h2 {
            color: #000000;
            margin-bottom: 30px;
            font-size: 1.2em;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 15px 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
            font-size: 0.9em;
        }
        
        th {
            background: #000000;
            color: #ffffff;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.85em;
        }
        
        tr:hover {
            background: #f8f8f8;
        }
        
        tr:last-child td {
            border-bottom: none;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666666;
            font-style: italic;
            font-weight: 300;
        }
        
        .error {
            background: #000000;
            color: #ffffff;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.9em;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 20px 15px;
            }
            
            h1 {
                font-size: 1.5em;
                margin-bottom: 30px;
            }
            
            .temp-display {
                font-size: 3.5em;
            }
            
            .current-temp,
            .controls,
            .chart-container,
            .data-table {
                padding: 25px 20px;
            }
            
            .control-group {
                flex-direction: column;
                align-items: stretch;
            }
            
            .control-group select,
            .control-group button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Мониторинг температуры</h1>
        
        <div class="current-temp">
            <div class="temp-label">Текущая температура</div>
            <div class="temp-display" id="currentTemp">--</div>
            <div class="timestamp" id="currentTimestamp">Загрузка...</div>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label for="periodSelect">Периодичность:</label>
                <select id="periodSelect">
                    <option value="3600">Последний час</option>
                    <option value="21600">Последние 6 часов</option>
                    <option value="86400" selected>Последние 24 часа</option>
                </select>
                
                <label for="viewType">View Type:</label>
                <select id="viewType">
                    <option value="all">Все измерения</option>
                    <option value="hourly" selected>Среднее (час)</option>
                    <option value="daily">Среднее (день)</option>
                </select>
                
                <button onclick="updateChart()">🔄 Обновить</button>
            </div>
        </div>
        
        <div class="chart-container">
            <h2>График температуры</h2>
            <canvas id="tempChart"></canvas>
        </div>
        
        <div class="data-table">
            <h2>Последние измерения</h2>
            <div id="tableContainer"></div>
        </div>
    </div>
    
    <script>
        let chart = null;
        
        async function updateCurrentTemp() {
            try {
                const response = await fetch('/api/current');
                const data = await response.json();
                
                if (data.error) {
                    document.getElementById('currentTemp').textContent = '--';
                    document.getElementById('currentTimestamp').textContent = 'Нет информации';
                } else {
                    document.getElementById('currentTemp').textContent = data.temperature + '°C';
                    document.getElementById('currentTimestamp').textContent = 'Обновлено: ' + data.timestamp;
                }
            } catch (error) {
                console.error('Error fetching current temperature:', error);
                document.getElementById('currentTemp').textContent = 'Error';
                document.getElementById('currentTimestamp').textContent = 'Ошибка';
            }
        }
        
        async function updateChart() {
            const period = parseInt(document.getElementById('periodSelect').value);
            const viewType = document.getElementById('viewType').value;
            
            const now = Math.floor(Date.now() / 1000);
            const start = now - period;
            
            try {
                const response = await fetch(`/api/stats?start=${start}&end=${now}&period=${viewType}`);
                const data = await response.json();
                
                let labels = [];
                let temperatures = [];
                
                if (viewType === 'all') {
                    data.forEach(item => {
                        labels.push(item.timestamp);
                        temperatures.push(item.temperature);
                    });
                } else {
                    data.forEach(item => {
                        labels.push(item.period_start);
                        temperatures.push(item.avg_temperature);
                    });
                }
                
                if (chart) {
                    chart.destroy();
                }
                
                const ctx = document.getElementById('tempChart').getContext('2d');
                chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Температура (°C)',
                            data: temperatures,
                            borderColor: '#000000',
                            backgroundColor: 'rgba(0, 0, 0, 0.05)',
                            borderWidth: 1,
                            tension: 0.4,
                            fill: true,
                            pointRadius: 2,
                            pointHoverRadius: 5,
                            pointBackgroundColor: '#000000'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        aspectRatio: 2.5,
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top',
                            },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                            }
                        },
                        scales: {
                            x: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Время'
                                },
                                ticks: {
                                    maxTicksLimit: 10,
                                    maxRotation: 45,
                                    minRotation: 45
                                }
                            },
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Температура (°C)'
                                }
                            }
                        }
                    }
                });
                
                updateTable(data, viewType);
                
            } catch (error) {
                console.error('Error fetching statistics:', error);
            }
        }
        
        function updateTable(data, viewType) {
            let html = '<table><thead><tr>';
            
            if (viewType === 'all') {
                html += '<th>Время</th><th>Температура (°C)</th>';
            } else {
                html += '<th>Начало периода</th><th>Конец периода</th><th>Средняя температура (°C)</th><th>Количество</th>';
            }
            
            html += '</tr></thead><tbody>';
            
            const displayData = data.slice(-20).reverse();
            
            displayData.forEach(item => {
                html += '<tr>';
                if (viewType === 'all') {
                    html += `<td>${item.timestamp}</td>`;
                    html += `<td>${item.temperature}</td>`;
                } else {
                    html += `<td>${item.period_start}</td>`;
                    html += `<td>${item.period_end}</td>`;
                    html += `<td>${item.avg_temperature.toFixed(2)}</td>`;
                    html += `<td>${item.count}</td>`;
                }
                html += '</tr>';
            });
            
            html += '</tbody></table>';
            
            document.getElementById('tableContainer').innerHTML = html;
        }
        
        setInterval(updateCurrentTemp, 5000);
        
        window.onload = function() {
            updateCurrentTemp();
            updateChart();
        };
    </script>
</body>
</html>
