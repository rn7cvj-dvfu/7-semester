<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мониторинг температуры</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-white text-black min-h-screen p-6">

<div class="max-w-7xl mx-auto">

    <h1 class="text-3xl font-light text-center mb-10">
        Мониторинг температуры
    </h1>

    <!-- Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

        <!-- LEFT SIDEBAR -->
        <aside class="lg:col-span-1 space-y-6">

            <!-- Current temperature -->
            <div class="bg-white rounded-lg shadow-sm p-6 text-center">
                <div class="text-xs uppercase tracking-widest mb-2">
                    Текущая температура
                </div>
                <div
                    id="currentTemp"
                    class="text-6xl font-light tracking-tight mb-3"
                >
                    --
                </div>
                <div
                    id="currentTimestamp"
                    class="text-sm text-gray-500"
                >
                    Загрузка…
                </div>
            </div>

            <!-- Controls -->
            <div class="bg-white rounded-lg shadow-sm p-4 space-y-4">

                <div>
                    <label class="block text-xs uppercase tracking-widest mb-1">
                        Период
                    </label>
                    <select
                        id="periodSelect"
                        class="w-full appearance-none border-0 px-3 py-2 text-sm
                               bg-white cursor-pointer
                               focus:outline-none focus:ring-2 focus:ring-black"
                    >
                        <option value="3600">Последний час</option>
                        <option value="43200">Последние 12 часов</option>
                        <option value="86400" selected>Последние 24 часа</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-widest mb-1">
                        Тип данных
                    </label>
                    <select
                        id="viewType"
                        class="w-full appearance-none border-0 px-3 py-2 text-sm
                               bg-white cursor-pointer
                               focus:outline-none focus:ring-2 focus:ring-black"
                    >
                        <option value="all">Все измерения</option>
                        <option value="hourly" selected>Среднее (час)</option>
                        <option value="daily">Среднее (день)</option>
                    </select>
                </div>

                <button
                    onclick="updateChart()"
                    class="w-full border-0 py-2 text-sm font-medium
                           hover:bg-black hover:text-white
                           active:scale-[0.98]
                           transition"
                >
                     Обновить
                </button>

            </div>

            <!-- Table -->
            <!-- <div class="border border-black p-4 overflow-x-auto">
                <h2 class="text-xs uppercase tracking-widest mb-3">
                    Последние измерения
                </h2>
                <div id="tableContainer"></div>
            </div> -->

        </aside>


        <main class="lg:col-span-3">
            <div class="bg-white rounded-lg shadow-sm p-6 h-full">
                <h2 class="text-xs uppercase tracking-widest mb-4">
                    График температуры
                </h2>
                <div class="relative h-[420px]">
                    <canvas id="tempChart"></canvas>
                </div>
            </div>
        </main>

    </div>
</div>

<script>
let chart = null;


async function updateCurrentTemp() {
    try {
        const response = await fetch('/api/current');
        const data = await response.json();

        if (data.error) {
            currentTemp.textContent = '--';
            currentTimestamp.textContent = 'Нет данных';
        } else {
            currentTemp.textContent = data.temperature + '°C';
            currentTimestamp.textContent = 'Обновлено: ' + data.timestamp;
        }
    } catch (e) {
        console.error(e);
        currentTemp.textContent = '--';
        currentTimestamp.textContent = 'Ошибка';
    }
}



async function updateChart() {
    const period = parseInt(document.getElementById('periodSelect').value);
    const viewType = document.getElementById('viewType').value;

    const now = Math.floor(Date.now() / 1000);
    const start = now - period;

    try {
        const response = await fetch(
            `/api/stats?start=${start}&end=${now}&period=${viewType}`
        );
        const data = await response.json();

        const labels = [];
        const temps = [];

        if (viewType === 'all') {
            data.forEach(item => {
                labels.push(item.timestamp);
                temps.push(item.temperature);
            });
        } else {
            data.forEach(item => {
                labels.push(item.period_start);
                temps.push(item.avg_temperature);
            });
        }

        if (chart) chart.destroy();

        chart = new Chart(
            document.getElementById('tempChart').getContext('2d'),
            {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Температура (°C)',
                        data: temps,
                        borderColor: '#000',
                        backgroundColor: 'rgba(0,0,0,0.05)',
                        tension: 0.4,
                        fill: true,
                        pointRadius: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                maxTicksLimit: 10,
                                maxRotation: 45,
                                minRotation: 45
                            }
                        }
                    }
                }
            }
        );

        updateTable(data, viewType);

    } catch (e) {
        console.error('Chart error:', e);
    }
}


function updateTable(data, viewType) {
    let html = `
        <table class="w-full text-sm border-collapse">
            <thead>
                <tr class="bg-black text-white">
    `;

    if (viewType === 'all') {
        html += `
            <th class="p-2 text-left">Время</th>
            <th class="p-2 text-left">°C</th>
        `;
    } else {
        html += `
            <th class="p-2 text-left">Начало</th>
            <th class="p-2 text-left">Конец</th>
            <th class="p-2 text-left">Среднее</th>
            <th class="p-2 text-left">Кол-во</th>
        `;
    }

    html += '</tr></thead><tbody>';

    data.slice(-20).reverse().forEach(item => {
        html += '<tr class="border-b hover:bg-gray-100">';
        if (viewType === 'all') {
            html += `
                <td class="p-2">${item.timestamp}</td>
                <td class="p-2">${item.temperature}</td>
            `;
        } else {
            html += `
                <td class="p-2">${item.period_start}</td>
                <td class="p-2">${item.period_end}</td>
                <td class="p-2">${item.avg_temperature.toFixed(2)}</td>
                <td class="p-2">${item.count}</td>
            `;
        }
        html += '</tr>';
    });

    html += '</tbody></table>';
    document.getElementById('tableContainer').innerHTML = html;
}


setInterval(updateCurrentTemp, 5000);

window.onload = () => {
    updateCurrentTemp();
    updateChart();
};
</script>

</body>
</html>
